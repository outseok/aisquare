.wordmark{opacity:0;font-family:'Tektur','Aldrich',system-ui,sans-serif;font-weight:500;font-size:80px;fill:#2c2c2a;letter-spacing:-1px}
.symbol{transform-origin:200px 180px;animation:breathe 5.6s ease-in-out 3.4s infinite}
.oe1{animation:draw .85s cubic-bezier(.22,1,.36,1) .10s forwards}
