.no5{animation:nodeIn .45s cubic-bezier(.34,1.4,.64,1) 2.60s forwards, travel 3s ease-in-out 6.2s infinite}
.ni0{animation:nodeInSmall .4s cubic-bezier(.34,1.4,.64,1) 2.35s forwards}
.ni1{animation:nodeInSmall .4s cubic-bezier(.34,1.4,.64,1) 2.42s forwards}
.ni2{animation:nodeInSmall .4s cubic-bezier(.34,1.4,.64,1) 2.49s forwards}
.ni3{animation:nodeInSmall .4s cubic-bezier(.34,1.4,.64,1) 2.56s forwards}
.ni4{animation:nodeInSmall .4s cubic-bezier(.34,1.4,.64,1) 2.63s forwards}
.ni5{animation:nodeInSmall .4s cubic-bezier(.34,1.4,.64,1) 2.70s forwards}
.wordmark{animation:wordIn .9s cubic-bezier(.22,1,.36,1) 2.85s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes faceIn{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
@keyframes nodeIn{0%{opacity:0;transform:scale(0)}55%{transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
@keyframes nodeInSmall{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes travel{0%,100%{transform:scale(1)}8%{transform:scale(1.4)}16%{transform:scale(1)}}
@keyframes wordIn{0%{opacity:0;letter-spacing:5px}100%{opacity:1;letter-spacing:-1px}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}
