<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 820 240" preserveAspectRatio="xMidYMid meet" aria-label="AISquare animated logo">
<defs>
<linearGradient id="metalStroke" x1="130" y1="100" x2="270" y2="260" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#7a7973"/>
<stop offset="50%" stop-color="#4a4a47"/>
<stop offset="100%" stop-color="#1a1a18"/>
</linearGradient>
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Tektur:wght@500;600;700&family=Aldrich&display=swap');
.outer-edge{fill:none;stroke:url(#metalStroke);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80}
.inner-hex{fill:none;stroke:#1a1a18;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:35;stroke-dashoffset:35}
