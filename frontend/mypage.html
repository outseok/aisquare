<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>마이페이지 — AISquare</title>
    <link rel="stylesheet" href="./styles.css?v=1779353750" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('aisquare-mock-store-v2');
          var u = s && JSON.parse(s).user;
          if (u) document.documentElement.classList.add('aisq-loggedin');
          if (u && u.isAdmin) document.documentElement.classList.add('aisq-admin');
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-screen-label="AISquare MyPage">
        <header class="answer-header">
      <div class="answer-wrap">
        <a class="answer-logo" href="./index.html" aria-label="AISquare 홈">
          <img src="./assets/aisquare_animated_logo.svg" alt="AISquare" />
        </a>
        <nav class="answer-tabs" aria-label="answer menu" id="answerTabs">
          <a class="active" href="./index.html" data-tab="home">홈</a>
          <a href="./market.html" data-tab="market">마켓</a>
          <a href="./ranking.html" data-tab="ranking">랭킹</a>
          <a href="./guide.html" data-tab="guide">이용가이드</a>
        </nav>
        <div class="answer-actions" aria-label="answer actions">
          <button type="button" class="hdr-icon" aria-label="검색" id="searchBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <a href="./mypage.html?tab=wishlist" class="hdr-icon" aria-label="찜" data-auth-only data-admin-hide>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </a>
          <a href="./mypage.html?tab=cart" class="hdr-icon" aria-label="장바구니" data-auth-only data-admin-hide>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="21" r="1.2" fill="currentColor"/><circle cx="18" cy="21" r="1.2" fill="currentColor"/><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
          </a>
          <a href="./sell.html" class="hdr-sell" data-auth-only data-admin-hide>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            상품 등록
          </a>
          <a href="./admin.html" class="hdr-admin" data-admin-only title="관리자 콘솔">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            관리자
            <span class="pending-badge hidden" id="hdrAdminBadge"></span>
          </a>
          <a href="./mypage.html" class="hdr-user" data-auth-only id="hdrUserChip">
            <span class="avatar" id="hdrAvatar">U</span>
            <span class="name" id="hdrName">사용자</span>
          </a>
          <a href="./login.html" class="hdr-login" data-anon-only>로그인</a>
          <a href="./register.html" class="hdr-signup" data-anon-only>회원가입</a>
          <button type="button" class="hdr-icon" aria-label="로그아웃" id="logoutBtn" title="로그아웃">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="mypage-section">
        <div class="kmong-wrap mypage-grid">
          <aside class="mypage-side">
            <h1>마이페이지</h1>
            <div class="mypage-user-card" id="mypageUserCard">
              <div class="top">
                <span class="av" id="mpAv">U</span>
                <div style="flex:1">
                  <div class="name" id="mpName">사용자</div>
                  <div class="uid" id="mpUid">@user</div>
                </div>
              </div>
              <div><span class="pass off" id="mpPass">○ 미인증</span></div>
              <div class="balances">
                <div class="bal"><span class="lbl">SQUARE</span><span class="val" id="mpSq">0<em>SQ</em></span></div>
                <div class="bal"><span class="lbl">POINT</span><span class="val" id="mpPt">0<em>P</em></span></div>
              </div>
            </div>
            <div class="mypage-tabs">
              <button class="mypage-tab is-active" data-tab="account">
                <span class="ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                계정 정보
              </button>
              <button class="mypage-tab" data-tab="wallet">
                <span class="ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg></span>
                지갑 관리
              </button>
              <button class="mypage-tab" data-tab="purchases">
                <span class="ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
                구매 내역
              </button>
              <button class="mypage-tab" data-tab="sales">
                <span class="ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 1-5h18l1 5"/><path d="M4 11v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9"/><path d="M22 7v3a2 2 0 1 1-4 0V7"/><path d="M14 7v3a2 2 0 1 1-4 0V7"/><path d="M6 7v3a2 2 0 0 1-4 0V7"/></svg></span>
                판매 내역
              </button>
              <button class="mypage-tab" data-tab="wishlist">
                <span class="ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg></span>
                찜 목록
              </button>
              <button class="mypage-tab" data-tab="cart">
                <span class="ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span>
                장바구니
              </button>
            </div>
          </aside>

          <div class="mypage-main">
            <div class="empty-state"><span>불러오는 중...</span></div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./api.js?v=1779353750"></script>
    <script src="./app.js?v=1779353750"></script>
  </body>
</html>
