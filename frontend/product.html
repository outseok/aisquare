<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>상품 상세 — AISquare</title>
    <link rel="stylesheet" href="./styles.css?v=1779353750" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('aisquare-mock-store-v2');
          var u = s && JSON.parse(s).user;
          if (u) document.documentElement.classList.add('aisq-loggedin');
          if (u && u.isAdmin) document.documentElement.classList.add('aisq-admin');
        } catch (e) {}
      })();
    </script>
    <style>
      .product-section { padding: 48px 0 96px; }
      .pd-grid { display: grid; grid-template-columns: 560px 1fr; gap: 48px; align-items: flex-start; }
      .pd-cover { width: 100%; aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; background: #f4f6fa; box-shadow: 0 18px 38px rgba(11, 13, 18, 0.10); }
      .pd-cover img { width: 100%; height: 100%; object-fit: cover; }

      .pd-info .badge { display: inline-block; padding: 4px 10px; background: #eef1ff; color: #1F3AE0; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: 0.1em; margin-bottom: 14px; }
      .pd-info h1 { margin: 0 0 14px; font-size: 28px; line-height: 1.35; letter-spacing: -0.4px; color: #1f2a38; }
      .pd-rating { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; color: #677181; font-size: 14px; }
      .pd-rating .star { color: #f5a623; font-weight: 900; }
      .pd-rating em { font-style: normal; color: #1f2a38; font-weight: 900; }
      .pd-rating .div { width: 1px; height: 12px; background: #ececf0; }

      .pd-price-box { background: #f8f9fb; border-radius: 14px; padding: 22px 26px; margin-bottom: 22px; }
      .pd-price-box .label { color: #87909d; font-size: 12.5px; letter-spacing: 0.05em; font-weight: 800; }
      .pd-price-box .price { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
      .pd-price-box .price b { font-size: 32px; font-weight: 900; color: #1f2a38; letter-spacing: -0.3px; }
      .pd-price-box .price span { color: #677181; font-size: 14px; font-weight: 700; }
      .pd-price-box .point-info { margin-top: 12px; color: #1F3AE0; font-size: 13px; font-weight: 700; }

      .pd-seller { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid #ececf0; border-radius: 12px; margin-bottom: 24px; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
      .pd-seller:hover { border-color: #1F3AE0; background: #fcfcff; }
      .pd-seller .av { width: 38px; height: 38px; border-radius: 50%; background: #1F3AE0; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; flex-shrink: 0; }
      .pd-seller .info { flex: 1; }
      .pd-seller .info b { display: block; font-size: 14px; color: #1f2a38; }
      .pd-seller .info span { display: block; margin-top: 2px; color: #677181; font-size: 12.5px; }
      .pd-seller .arrow { color: #87909d; font-weight: 900; }

      .pd-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
      .pd-btn { height: 50px; border: 1px solid #d4dae4; background: #fff; color: #1f2a38; border-radius: 8px; font-size: 14.5px; font-weight: 800; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.08s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      .pd-btn .pd-icn { font-size: 17px; line-height: 1; }
      .pd-btn:hover { background: #f4f6fa; border-color: #1F3AE0; color: #1F3AE0; }
      .pd-btn:active { transform: scale(0.98); }
      /* Active state — wish heart goes red, cart goes blue-filled */
      #pdWish[data-state="on"] {
        background: #ffeded; border-color: #ff3357; color: #ff3357;
      }
      #pdWish[data-state="on"] .pd-icn { color: #ff3357; font-size: 18px; }
      #pdWish[data-state="on"]:hover { background: #ffd6dd; }
      #pdCart[data-state="on"] {
        background: #eef1ff; border-color: #1F3AE0; color: #1F3AE0;
      }
      #pdCart[data-state="on"]:hover { background: #dee4ff; }
      .pd-buy:disabled { opacity: 0.7; cursor: not-allowed; }
      .pd-buy { width: 100%; height: 56px; background: #050505; color: #fff; border: 0; border-radius: 8px; font-size: 16px; font-weight: 900; cursor: pointer; transition: background 0.15s ease, transform 0.08s ease; }
      .pd-buy:hover { background: #1F3AE0; }
      .pd-buy:active { transform: scale(0.98); }

      .pd-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; padding-top: 24px; border-top: 1px solid #ececf0; }
      .pd-meta-item { font-size: 13px; }
      .pd-meta-item .k { display: block; color: #87909d; margin-bottom: 4px; font-weight: 700; }
      .pd-meta-item .v { color: #1f2a38; font-weight: 700; }

      .pd-sections { margin-top: 64px; display: grid; grid-template-columns: 1fr; gap: 48px; }
      .pd-block h2 { margin: 0 0 16px; font-size: 22px; letter-spacing: -0.2px; }
      .pd-block p { margin: 0; color: #3f4a59; font-size: 15px; line-height: 1.75; }

      .pd-reviews { display: flex; flex-direction: column; gap: 12px; }
      .pd-review { padding: 18px 22px; border: 1px solid #ececf0; border-radius: 12px; background: #fff; }
      .pd-review .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
      .pd-review .head .av { width: 28px; height: 28px; border-radius: 50%; background: #f4f6fa; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #677181; }
      .pd-review .head b { color: #1f2a38; }
      .pd-review .head .star { margin-left: auto; color: #f5a623; font-weight: 900; }
      .pd-review p { margin: 0; color: #3f4a59; font-size: 14px; line-height: 1.6; }

      .pd-empty { padding: 80px 0; text-align: center; color: #87909d; }

      @media (max-width: 960px) {
        .pd-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>

          </a>

    <main>
      <section class="product-section">
        <div class="kmong-wrap">
          <div id="productRoot">
            <div class="pd-empty">상품 정보를 불러오는 중...</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="kmong-footer">
      <div class="kmong-wrap">
        <div class="footer-bottom">
          <img class="kmong-logo" src="./assets/aisquare_logo_static.svg" alt="AISquare" />
        </div>
        <p class="company muted">Copyright © 2026 AISquare Inc. All rights reserved.</p>
      </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./api.js?v=1779353750"></script>
    <script src="./app.js?v=1779353750"></script>
    <script>
      (async function() {
        var api = window.AISquareAPI;
        var qs = new URLSearchParams(location.search);
        var id = qs.get('id');
        var root = document.getElementById('productRoot');
        var t = function(m){ (window.showToast || alert)(m); };

        if (!id) {
          root.innerHTML = '<div class="pd-empty">상품 ID가 지정되지 않았습니다.<br /><a href="./market.html" style="color:#1F3AE0;font-weight:800;display:inline-block;margin-top:18px;">마켓으로 이동</a></div>';
          return;
        }

        var product;
        try { product = await api.products.get(id); } catch (e) {}
        if (!product) {
          root.innerHTML = '<div class="pd-empty">해당 상품을 찾을 수 없습니다.<br /><a href="./market.html" style="color:#1F3AE0;font-weight:800;display:inline-block;margin-top:18px;">마켓으로 돌아가기</a></div>';
          return;
        }

        var pointReward = Math.floor(product.priceSquare * 0.02);
        var fileType = product.fileType || 'PDF';
        var badge = product.badge ? '<span class="badge">' + product.badge + '</span>' : '<span class="badge">' + (product.tags?.[0]?.toUpperCase() || 'NEW') + '</span>';
        var stars = '★★★★★'.slice(0, Math.round(product.rating));

        var sellerInitial = (product.sellerName || product.sellerUsername || 'U')[0];

        root.innerHTML = [
          '<div class="pd-grid">',
            '<div class="pd-cover"><img src="./assets/' + product.cover + '" alt="' + product.title + '" /></div>',
            '<div class="pd-info">',
              badge,
              '<h1>' + product.title + '</h1>',
              '<div class="pd-rating">',
                '<span class="star">' + stars + '</span>',
                '<em>' + product.rating.toFixed(1) + '</em>',
                '<span>리뷰 ' + product.reviewCount + '건</span>',
                '<div class="div"></div>',
                '<span>' + fileType + ' 파일</span>',
              '</div>',
              '<div class="pd-price-box">',
                '<span class="label">판매 가격</span>',
                '<div class="price"><b>' + product.priceSquare.toLocaleString() + '</b><span>Square</span></div>',
                '<div class="point-info">결제 시 +5% 수수료 (₩' + Math.floor(product.priceSquare * 1.05).toLocaleString() + ' 결제) · 구매 확정 시 ' + pointReward + ' Square 캐시백 (2%)</div>',
              '</div>',
              '<div class="pd-seller" id="pdSeller" data-username="' + product.sellerUsername + '">',
                '<div class="av">' + sellerInitial + '</div>',
                '<div class="info"><b>' + product.sellerName + '</b><span id="pdSellerStats">불러오는 중...</span></div>',
                '<div class="arrow">›</div>',
              '</div>',
              '<div class="pd-actions">',
                '<button class="pd-btn" id="pdWish" data-state="off"><span class="pd-icn">♡</span><span class="pd-label">찜하기</span></button>',
                '<button class="pd-btn" id="pdCart" data-state="off"><span class="pd-icn">🛒</span><span class="pd-label">장바구니</span></button>',
              '</div>',
              '<button class="pd-buy" id="pdBuy">' + product.priceSquare.toLocaleString() + ' Square로 바로 구매</button>',
              '<div class="pd-meta">',
                '<div class="pd-meta-item"><span class="k">카테고리</span><span class="v">' + (product.category || '-') + '</span></div>',
                '<div class="pd-meta-item"><span class="k">등록일</span><span class="v">' + (product.createdAt || '-') + '</span></div>',
                '<div class="pd-meta-item"><span class="k">파일 형식</span><span class="v">' + fileType + '</span></div>',
                '<div class="pd-meta-item"><span class="k">구매 확정</span><span class="v">72시간 자동</span></div>',
              '</div>',
            '</div>',
          '</div>',
          '<div class="pd-sections">',
            '<div class="pd-block">',
              '<h2>이 상품은 어떤 노하우인가요?</h2>',
              '<p>실무에서 검증된 ' + (product.tags || []).join(' · ') + ' 노하우를 즉시 활용할 수 있는 형태로 정리한 자료입니다. 다운로드 후 자유롭게 수정·재가공하여 사용하실 수 있으며, 72시간 자동 확정 정책으로 안전하게 거래됩니다.</p>',
            '</div>',
            // 상품별 리뷰는 1:1 판매 특성상 부적합 — 판매자 페이지의 통합 리뷰로 안내
            '<div class="pd-block" style="background:#fafbfc;border:1px dashed #d4dae4;border-radius:14px;padding:24px 28px;text-align:center;">',
              '<p style="margin:0 0 6px;color:#1f2a38;font-size:14.5px;font-weight:700;">이 판매자의 리뷰는 판매자 페이지에서 모아 보실 수 있어요.</p>',
              '<p style="margin:0 0 14px;color:#677181;font-size:12.5px;line-height:1.6;">AISquare는 1:1 디지털 자산 거래 특성상 상품별 리뷰가 아닌 판매자 단위로 신뢰도와 리뷰를 관리합니다.</p>',
              '<a href="./seller.html?u=' + encodeURIComponent(product.sellerUsername || '') + '" style="display:inline-block;padding:10px 22px;background:#050505;color:#fff;border-radius:8px;font-weight:800;font-size:13px;text-decoration:none;">' + String(product.sellerName || product.sellerUsername || '판매자').replace(/[&<>"\047]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) + ' 페이지에서 리뷰 보기 →</a>',
            '</div>',
          '</div>'
        ].join('');

        // Wire actions — initialize button states from BE
        const wishBtn = document.getElementById('pdWish');
        const cartBtn = document.getElementById('pdCart');
        const buyBtn  = document.getElementById('pdBuy');

        function setWishState(on) {
          wishBtn.dataset.state = on ? 'on' : 'off';
          wishBtn.querySelector('.pd-icn').textContent = on ? '❤' : '♡';
          wishBtn.querySelector('.pd-label').textContent = on ? '찜됨' : '찜하기';
        }
        function setCartState(on) {
          cartBtn.dataset.state = on ? 'on' : 'off';
          cartBtn.querySelector('.pd-icn').textContent = on ? '✓🛒' : '🛒';
          cartBtn.querySelector('.pd-label').textContent = on ? '담김' : '장바구니';
        }

        // Sync initial state from BE wishlist/cart
        if (api.isLoggedIn()) {
          (async () => {
            try {
              const [w, c] = await Promise.all([
                api.wishlist.getList().catch(() => []),
                api.cart.getList().catch(() => []),
              ]);
              if ((w || []).some(p => p.id === product.id)) setWishState(true);
              if ((c || []).some(p => p.id === product.id)) setCartState(true);
            } catch (e) { /* ignore */ }
          })();
        }

        wishBtn.addEventListener('click', async function() {
          if (!api.isLoggedIn()) { t('로그인이 필요합니다.'); setTimeout(function(){ location.href='./login.html'; }, 800); return; }
          const wasOn = wishBtn.dataset.state === 'on';
          try {
            if (wasOn) { await api.wishlist.remove(product.id); setWishState(false); t('찜에서 제거했습니다.'); }
            else      { await api.wishlist.add(product.id);    setWishState(true);  t('찜 목록에 추가했습니다.'); }
          } catch (e) {
            if (/이미/.test(e.message)) { setWishState(true); t('이미 찜한 상품입니다.'); }
            else t(e.message || '찜 처리에 실패했습니다.');
          }
        });
        cartBtn.addEventListener('click', async function() {
          if (!api.isLoggedIn()) { t('로그인이 필요합니다.'); setTimeout(function(){ location.href='./login.html'; }, 800); return; }
          const wasOn = cartBtn.dataset.state === 'on';
          try {
            if (wasOn) { await api.cart.remove(product.id); setCartState(false); t('장바구니에서 제거했습니다.'); }
            else      { await api.cart.add(product.id);    setCartState(true);  t('장바구니에 담았습니다.'); }
          } catch (e) {
            if (/이미/.test(e.message)) { setCartState(true); t('이미 장바구니에 있는 상품입니다.'); }
            else t(e.message || '장바구니 처리에 실패했습니다.');
          }
        });

        buyBtn.addEventListener('click', async function() {
          if (!api.isLoggedIn() || !api.getJwt()) {
            t('로그인이 필요합니다.');
            setTimeout(function(){ location.href='./login.html'; }, 800);
            return;
          }
          // 결제 페이지(checkout)로 이동 — 거기서 Toss/Square/Point 복합 결제 선택
          location.href = './checkout.html?id=' + encodeURIComponent(product.id);
          return;

          // 아래 코드는 Toss 콜백 처리용으로 남겨둠 (toss=success/fail 쿼리로 돌아오면 confirm)
          const me = api.getCurrentUser() || {};
          if (!me.phoneVerified && !me.passVerified) {
            t('PASS 본인인증이 필요합니다. 마이페이지에서 인증해 주세요.');
            setTimeout(function(){ location.href='./mypage.html'; }, 1200);
            return;
          }
          buyBtn.disabled = true;
          const originalText = buyBtn.textContent;
          buyBtn.textContent = '결제 처리 중...';
          try {
            const cfg = await api.payments.tossConfig();
            const reqRes = await api.payments.requestProductPay(product.id);

            // Dev bypass — BE has TOSS_DEV_BYPASS=1: skip Toss SDK + confirm directly.
            if (cfg.devBypass) {
              await api.payments.confirmProductPay('dev-fake-key', reqRes.tossOrderId, reqRes.amountKrw);
              t('결제가 완료되었습니다. 마이페이지로 이동합니다...');
              setTimeout(function(){ location.href='./mypage.html?tab=purchases'; }, 1200);
              return;
            }

            // 2. Real flow — load Toss SDK and open payment widget
            if (!window.TossPayments) {
              await new Promise(function(resolve, reject) {
                var s = document.createElement('script');
                s.src = 'https://js.tosspayments.com/v1/payment';
                s.onload = resolve; s.onerror = reject;
                document.head.appendChild(s);
              });
            }
            const tossPayments = TossPayments(cfg.clientKey);
            const successUrl = location.origin + '/product.html?id=' + encodeURIComponent(product.id) + '&toss=success&amount=' + reqRes.amountKrw;
            const failUrl = location.origin + '/product.html?id=' + encodeURIComponent(product.id) + '&toss=fail';
            tossPayments.requestPayment('카드', {
              amount: reqRes.amountKrw,
              orderId: reqRes.tossOrderId,
              orderName: reqRes.orderName,
              successUrl: successUrl,
              failUrl: failUrl,
              customerName: (api.getCurrentUser() && api.getCurrentUser().nickname) || '구매자',
            });
          } catch (err) {
            console.error('buy failed:', err);
            buyBtn.disabled = false;
            buyBtn.textContent = originalText;
            if (err.status === 401) t('로그인 세션이 만료됐습니다. 다시 로그인해 주세요.');
            else if (err.status === 403) t('PASS 본인인증이 필요합니다.');
            else if (err.status === 400 && /이미|판매/.test(err.message)) t('이미 판매된 상품입니다.');
            else t(err.message || '결제 요청 실패');
          }
        });

        // Handle Toss success callback (return from Toss with ?paymentKey&orderId&amount)
        var p = new URLSearchParams(location.search);
        if (p.get('toss') === 'success' && p.get('paymentKey') && p.get('orderId') && p.get('amount')) {
          (async function(){
            try {
              await api.payments.confirmProductPay(p.get('paymentKey'), p.get('orderId'), parseInt(p.get('amount'),10));
              t('결제가 완료되었습니다.');
              setTimeout(function(){ location.href='./mypage.html?tab=purchases'; }, 1200);
            } catch (e) { t('결제 승인 실패: ' + (e.message||'')); }
          })();
        }
        if (p.get('toss') === 'fail') { t('결제가 취소되었거나 실패했습니다.'); }

        // Fetch seller stats and display rating + total sold inline
        (async () => {
          if (!product.sellerUsername) return;
          try {
            const s = await api.products.sellerStats(product.sellerUsername);
            const avg = (s.avgRating || 0).toFixed(1);
            const star = '★'.repeat(Math.round(s.avgRating || 0)) + '☆'.repeat(5 - Math.round(s.avgRating || 0));
            const el = document.getElementById('pdSellerStats');
            if (el) el.innerHTML = `<span style="color:#f5a623;font-weight:900;">${star}</span> ${avg} · 리뷰 ${s.reviewCount || 0}건 · 판매 ${s.totalSold || 0}건`;
          } catch (e) { /* keep default */ }
        })();
        document.getElementById('pdSeller').addEventListener('click', function() {
          if (!product.sellerUsername) return;
          location.href = './seller.html?u=' + encodeURIComponent(product.sellerUsername);
        });
      })();
    </script>
  </body>
</html>
