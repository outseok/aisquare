version: '3.8'

networks:
  recode-net:
    name: recode-net

services:
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.example.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    volumes:
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - recode-net

  # AISquare 운영팀 peer
  peer0.aisquare.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.aisquare.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=recode-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.aisquare.com
      - CORE_PEER_ADDRESS=peer0.aisquare.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.aisquare.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.aisquare.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.aisquare.com:7051
      - CORE_PEER_LOCALMSPID=AISquareMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/aisquare.com/peers/peer0.aisquare.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/aisquare.com/peers/peer0.aisquare.com/tls:/etc/hyperledger/fabric/tls
    ports:
      - "7051:7051"
    depends_on:
      - orderer.example.com
    networks:
      - recode-net

  # NaverPay 운영팀 peer (naver-channel 참여)
  peer0.naverpay.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.naverpay.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=recode-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.naverpay.com
      - CORE_PEER_ADDRESS=peer0.naverpay.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.naverpay.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.naverpay.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.naverpay.com:8051
      - CORE_PEER_LOCALMSPID=NaverPayMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/naverpay.com/peers/peer0.naverpay.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/naverpay.com/peers/peer0.naverpay.com/tls:/etc/hyperledger/fabric/tls
    ports:
      - "8051:8051"
    depends_on:
      - orderer.example.com
    networks:
      - recode-net

  # CLI 컨테이너 — osnadmin, peer 등 모든 fabric 바이너리 + AISquare/NaverPay 자격증명 마운트
  cli:
    image: hyperledger/fabric-tools:2.5
    container_name: fabric-cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config:/etc/hyperledger/crypto-config
      - ./channel-artifacts:/etc/hyperledger/channel-artifacts
      - ../chaincode:/opt/chaincode
      - ../bin:/usr/local/bin/fabric-bin
    networks:
      - recode-net
