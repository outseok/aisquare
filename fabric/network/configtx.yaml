---
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.example.com:7050

  - &AISquare
    Name: AISquareMSP
    ID: AISquareMSP
    MSPDir: crypto-config/peerOrganizations/aisquare.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('AISquareMSP.admin','AISquareMSP.peer','AISquareMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('AISquareMSP.admin','AISquareMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AISquareMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('AISquareMSP.peer')"
    AnchorPeers:
      - Host: peer0.aisquare.com
        Port: 7051

  - &NaverPay
    Name: NaverPayMSP
    ID: NaverPayMSP
    MSPDir: crypto-config/peerOrganizations/naverpay.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('NaverPayMSP.admin','NaverPayMSP.peer','NaverPayMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('NaverPayMSP.admin','NaverPayMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('NaverPayMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('NaverPayMSP.peer')"
    AnchorPeers:
      - Host: peer0.naverpay.com
        Port: 8051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.example.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.example.com
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  # ────────────────────────────────────────────────────────
  # internal-channel: AISquare 단독 (Square wallet, ACTIVITY 포인트, 에스크로)
  # ────────────────────────────────────────────────────────
  InternalGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *AISquare
    Consortium: RecodeConsortium

  # ────────────────────────────────────────────────────────
  # naver-channel: AISquare + NaverPay (PAID 포인트 전환 원장)
  # ────────────────────────────────────────────────────────
  NaverChannelGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *AISquare
        - *NaverPay
    Consortium: RecodeConsortium
